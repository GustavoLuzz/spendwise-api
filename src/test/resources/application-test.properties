spring.datasource.url=jdbc:h2:mem:spendwise;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=CATEGORY,TRANSACTION;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

jwt.secret=test-only-jwt-secret-that-is-long-enough-for-hmac-signing-1234567890
jwt.validity=60000

app.cors.allowed-origins=http://localhost:3000

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
