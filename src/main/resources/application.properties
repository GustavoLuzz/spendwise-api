spring.application.name=spendwise-api
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.validity=${JWT_VALIDITY:604800000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

app.exchange-rate.base-url=${AWESOME_API_URL:https://economia.awesomeapi.com.br}
app.exchange-rate.api-key=${AWESOME_API_KEY:}
app.exchange-rate.connect-timeout-ms=${EXCHANGE_RATE_CONNECT_TIMEOUT_MS:3000}
app.exchange-rate.read-timeout-ms=${EXCHANGE_RATE_READ_TIMEOUT_MS:5000}
app.exchange-rate.cache-ttl-seconds=${EXCHANGE_RATE_CACHE_TTL_SECONDS:60}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
